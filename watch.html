<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch — YouTube Clone</title>
    <meta name="description" content="Watch videos on YouTube Clone" />

    <link rel="stylesheet" href="styles/general.css" />
    <link rel="stylesheet" href="styles/watch.css" />

    <script type="application/ld+json" id="ld-json">{}</script>
  </head>
  <body>
    <a class="skip-link" href="#video-player">Skip to content</a>
    <header class="header">
      <div class="left-section">
        <a class="youtube-home-container" href="index.html" aria-label="YouTube Home">
          <img class="youtube-logo" src="icons/youtube-logo.svg" alt="" />
        </a>
      </div>
    </header>

    <main id="main-content" role="main">
      <div class="watch-layout">
        <section class="watch-main">
          <div id="video-player" class="video-player" tabindex="0">
            <!-- iframe will be injected here -->
          </div>

          <h2 id="video-title" class="video-title">Loading…</h2>
          <div class="video-meta">
            <div class="channel-section">
              <img id="channel-image" class="profile-picture" src="" alt="" />
              <div>
                <div id="channel-name" class="channel-name">Channel</div>
                <button id="subscribe-button" class="subscribe-button">Subscribe</button>
              </div>
            </div>
            <div class="video-actions">
              <button id="like-button" class="icon-button" aria-pressed="false">👍 Like</button>
              <button id="save-button" class="icon-button" aria-pressed="false">💾 Save</button>
            </div>
          </div>

          <div id="description" class="video-description"></div>

          <section class="comments" aria-label="Comments">
            <h3>Comments</h3>
            <form id="comment-form">
              <label for="comment-input" class="visually-hidden">Add a comment</label>
              <textarea id="comment-input" rows="2" placeholder="Add a public comment..."></textarea>
              <button type="submit">Comment</button>
            </form>
            <ul id="comments-list" class="comments-list" aria-live="polite"></ul>
          </section>
        </section>

        <aside class="suggested" aria-label="Up next">
          <h3>Up next</h3>
          <div id="suggested-list"></div>
        </aside>
      </div>
    </main>

    <script src="scripts/videos.js"></script>
    <script src="scripts/watch.js" defer></script>
  </body>
</html>
